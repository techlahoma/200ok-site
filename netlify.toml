# [build]
#   base = "."
#   publish = "public/"
#   command = "make deploy"

# https://cli.netlify.com/netlify-dev#netlifytoml-dev-block
[dev]
  command = "npm run dev"
  autoLaunch = false

# Redirect the default subdomain to the primary domain
[[redirects]]
  from = "https://200ok.netlify.app/*"
  to = "https://200ok.us/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/tickets"
  to = "https://ti.to/techlahoma/200ok-2026"
  status = 302
  force = true

[[redirects]]
  from = "/survey"
  to = "https://docs.google.com/forms/d/e/1FAIpQLSdggrJUmqeYB89Ph811NylZz3IP6CHtmSx6XZLTxPK46BS85Q/viewform"
  status = 302
  force = true

[[redirects]]
  from = "/volunteer"
  to = "https://forms.gle/tP4THE8bUM7jjiUq9"
  status = 302
  force = true