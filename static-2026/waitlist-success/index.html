<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">

    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="content-type" content="text/html; charset=utf-8">
    <meta name="description" content="Confirmation page for the 200OK 2027 waitlist.">

    <link rel="stylesheet" href="/generated-styles.css">
    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">

<body class="bg-[#ded8d1] text-[#403d3c] font-sans bg-gif min-h-dvh">
    <header>
        <nav>
            <ul class="list-none border p-8 flex flex-wrap gap-x-4 gap-y-3 font-bold font-instrument text-xl uppercase tracking-wide items-center">
                <li><a class="underline hover:text-[#803c28]" href="/">2026 Site</a></li>
                <li><a class="underline hover:text-[#803c28]" href="/waitlist/">Waitlist</a></li>
            </ul>
        </nav>
    </header>

    <main class="mb-16">
        <section class="py-12">
            <div class="container px-8 max-w-screen-md text-center text-[#4a1d0f]">
                <a class="mx-auto mb-8 block max-w-lg" href="/">
                    <img class="w-full block mb-2" src="/assets/img/200ok-2026.svg" alt="200OK">
                    <div class="block text-right font-trop-magic text-3xl sm:text-4xl"><span class="text-[#da6343]">Developer</span> Conference</div>

                    <p class="mx-auto max-w-xl font-instrument text-3xl leading-[1.15em] italic text-[#803c28]">Thanks for raising your hand for 200OK 2027. We will send updates when tickets, speaker submissions, sponsorships, or volunteer plans are ready.</p>
                    <p class="mt-8">
                        <a class="bg-[#4a1d0f] text-stone-200 border-[#4a1d0f] hover:bg-[#da6343] hover:border-[#da6343] inline-block rounded-2xl border pt-3 pb-2 px-6 text-center font-trop-magic text-3xl" href="/">Back to 200OK</a>
                    </p>
                </div>
            </div>
        </section>
    </main>

    <footer class="bg-[#38150b] py-6 md:py-8 uppercase tracking-wide w-full text-stone-200 font-mono">
        <div class="container px-8 max-w-screen-xl">
            <span class="block text-stone-200">&copy; 2026 <a href="https://www.techlahoma.org/" class="hover:bg-[#da6343] hover:text-stone-200 underline">Techlahoma Foundation</a></span>
